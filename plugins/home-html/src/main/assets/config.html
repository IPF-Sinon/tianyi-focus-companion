<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>主题设置</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:#EEF3FA; color:#0B1A33; min-height:100vh; padding:20px 16px; }
  @media (prefers-color-scheme:dark) { body { background:#0F1620; color:#ECF2FA; } }
  .card { background:#fff; border-radius:24px; padding:18px; margin-bottom:14px; box-shadow:0 8px 24px rgba(74,144,226,.06); }
  @media (prefers-color-scheme:dark) { .card { background:#1A2332; } }
  h1 { font-size:22px; margin-bottom:4px; }
  .muted { color:#6B7A93; font-size:13px; line-height:1.6; }
  .btn { display:block; width:100%; border:none; border-radius:24px; padding:16px; font-size:16px; font-weight:600; cursor:pointer; margin-top:12px; }
  .btn.primary { background:linear-gradient(135deg,#66CCFF,#4A90E2); color:#fff; }
  .btn.danger { background:rgba(224,85,85,.12); color:#E05555; }
  .badge { display:inline-block; padding:3px 12px; border-radius:30px; font-size:11px; font-weight:500; background:rgba(74,144,226,.12); color:#4A90E2; }
  .path { font-family:monospace; font-size:11px; background:rgba(0,0,0,.05); border-radius:8px; padding:8px 10px; word-break:break-all; margin-top:8px; }
</style>
</head>
<body>
  <div class="card">
    <h1>主题设置</h1>
    <p class="muted">主题包完全控制应用界面（底栏、专注、统计、插件、设置页）。</p>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span style="font-weight:600;">当前主题</span>
      <span class="badge" id="theme-source">…</span>
    </div>
    <p class="muted" id="theme-desc">读取中…</p>
  </div>

  <div class="card">
    <p class="muted">从本地选择 <b>zip 主题包</b> 导入。zip 需包含 index.html，也可带 style.css / app.js 等资源。</p>
    <button class="btn primary" id="btn-import">📦 导入主题包</button>
  </div>

  <div class="card" id="user-card" style="display:none;">
    <p class="muted">自定义主题存放在以下目录：</p>
    <div class="path" id="theme-dir"></div>
    <button class="btn danger" id="btn-reset">↩ 恢复默认主题</button>
  </div>

  <script>
    'use strict';

    function refresh() {
      var info = JSON.parse(window.TianyiHost.getThemeInfo());
      var source = document.getElementById('theme-source');
      var desc = document.getElementById('theme-desc');
      var userCard = document.getElementById('user-card');

      if (info.installed) {
        source.textContent = '自定义主题';
        source.style.background = 'rgba(74,144,226,.12)';
        source.style.color = '#4A90E2';
        desc.textContent = '正在使用用户自定义主题包。';
        userCard.style.display = 'block';
        document.getElementById('theme-dir').textContent = info.dir || '';
      } else {
        source.textContent = '内置默认主题';
        source.style.background = 'var(--outline,#E4ECF5)';
        source.style.color = 'var(--sub,#6B7A93)';
        desc.textContent = '正在使用应用内置的默认主题。';
        userCard.style.display = 'none';
      }
    }

    document.getElementById('btn-import').addEventListener('click', function () {
      var ok = window.TianyiHost.importTheme();
      if (!ok) alert('无法打开文件选择器');
      // 导入完成后 Activity 关闭，页面 onResume 重载生效
    });

    document.getElementById('btn-reset').addEventListener('click', function () {
      if (!confirm('确定恢复为内置默认主题？')) return;
      var ok = window.TianyiHost.resetTheme();
      if (ok) {
        alert('已恢复默认主题');
        refresh();
        setTimeout(function () { location.reload(); }, 400);
      } else {
        alert('恢复失败');
      }
    });

    refresh();
  </script>
</body>
</html>
