name: 构建 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 初始化 Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: 'true'

      - name: 安装 Android SDK 组件
        run: |
          sdkmanager "platforms;android-37" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses

      - name: 生成 Gradle Wrapper
        run: |
          apt-get update -qq && apt-get install -y -qq gradle 2>/dev/null || true
          # 如果系统没装 gradle，去下载
          if ! command -v gradle &> /dev/null; then
            curl -sL -o /tmp/gradle-bin.zip "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
            unzip -q /tmp/gradle-bin.zip -d /opt
            export PATH=/opt/gradle-8.11.1/bin:$PATH
          fi
          gradle wrapper --gradle-version 8.11.1

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 构建 Debug APK
        run: ./gradlew :host:assembleDebug --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: YijianZhongqin-Debug-APK
          path: host/build/outputs/apk/debug/*.apk
          retention-days: 30
