name: 构建 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 初始化 Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: 'true'

      - name: 安装 Android SDK 组件
        run: |
          # 平台 android-35 已预装在 runner 上，补装 build-tools 和 platform-tools
          yes | sdkmanager "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1 || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 生成 Gradle Wrapper
        run: |
          # 下载指定版本 Gradle 生成 wrapper（AGP 9.1 需要 Gradle 9.1+）
          curl -sL -o /tmp/gradle-bin.zip "https://services.gradle.org/distributions/gradle-9.7.1-bin.zip"
          unzip -q /tmp/gradle-bin.zip -d /opt
          export PATH=/opt/gradle-9.7.1/bin:$PATH
          gradle wrapper --gradle-version 9.7.1
          ls -la gradlew

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 构建 Debug APK
        run: ./gradlew :host:assembleDebug --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: YijianZhongqin-Debug-APK
          path: host/build/outputs/apk/debug/*.apk
          retention-days: 30
