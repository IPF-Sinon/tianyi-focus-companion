<style>
  .theme-cfg { font-size: 14px; }
  .theme-cfg .cfg-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--outline, #E4ECF5);
  }
  .theme-cfg .cfg-row:last-of-type { border-bottom: none; }
  .theme-cfg .cfg-title { font-weight: 600; }
  .theme-cfg .cfg-sub { font-size: 12px; color: var(--sub, #6B7A93); margin-top: 2px; }
  .theme-cfg .cfg-path {
    font-family: monospace; font-size: 11px; word-break: break-all;
    background: rgba(0,0,0,.05); border-radius: 8px; padding: 8px 10px; margin-top: 8px;
  }
  .theme-cfg .cfg-btn {
    display: block; width: 100%; border: none; border-radius: 20px;
    padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 12px;
  }
  .theme-cfg .cfg-btn.primary {
    background: linear-gradient(135deg, var(--primary-light, #66CCFF), var(--primary, #4A90E2));
    color: #fff;
  }
  .theme-cfg .cfg-btn.danger { background: rgba(224,85,85,.12); color: #E05555; }
</style>

<div class="theme-cfg">
  <div class="cfg-row">
    <div>
      <div class="cfg-title">当前主题</div>
      <div class="cfg-sub" id="tcfg-desc">读取中…</div>
    </div>
    <span class="badge" id="tcfg-source">…</span>
  </div>

  <div class="cfg-sub" style="margin-top:10px;">
    从本地选择 <b>zip 主题包</b> 导入。zip 需包含 index.html，可附带 style.css / app.js 等资源。
  </div>
  <button class="cfg-btn primary" id="tcfg-import">📦 导入主题包</button>

  <div id="tcfg-user" style="display:none;">
    <div class="cfg-sub" style="margin-top:14px;">自定义主题存放目录：</div>
    <div class="cfg-path" id="tcfg-dir"></div>
    <button class="cfg-btn danger" id="tcfg-reset">↩ 恢复内置默认主题</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  // 该片段被主题内联到主页面，可直接使用 window.TianyiHost

  function refresh() {
    var info = {};
    try { info = JSON.parse(window.TianyiHost.getThemeInfo() || '{}'); } catch (e) {}

    var source = document.getElementById('tcfg-source');
    var desc = document.getElementById('tcfg-desc');
    var user = document.getElementById('tcfg-user');
    if (!source || !desc || !user) return;

    if (info.installed) {
      source.textContent = '自定义';
      source.className = 'badge';
      desc.textContent = '正在使用用户导入的主题包';
      user.style.display = 'block';
      document.getElementById('tcfg-dir').textContent = info.dir || '';
    } else {
      source.textContent = '内置';
      source.className = 'badge off';
      desc.textContent = '正在使用应用内置的默认主题';
      user.style.display = 'none';
    }
  }

  var importBtn = document.getElementById('tcfg-import');
  if (importBtn) {
    importBtn.addEventListener('click', function () {
      var ok = window.TianyiHost.importTheme();
      if (!ok) alert('无法打开文件选择器');
      // 选择完成后 Activity 关闭，主界面 onResume 检测到主题变化会自动重载
    });
  }

  var resetBtn = document.getElementById('tcfg-reset');
  if (resetBtn) {
    resetBtn.addEventListener('click', function () {
      if (!confirm('确定恢复为内置默认主题？')) return;
      if (window.TianyiHost.resetTheme()) {
        refresh();
        setTimeout(function () { location.reload(); }, 300);
      } else {
        alert('恢复失败');
      }
    });
  }

  refresh();
})();
</script>
